<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" role="img" aria-labelledby="title desc">
  <title id="title">Shoemaker Elves: plan, execute, review and plan the next batch</title>
  <desc id="desc">An illustrative LLM-mode workflow. An LLM plans a batch of atomic tasks, a coding agent executes them one at a time, and the LLM reviews results before planning the next batch. The return path represents the review loop, not measured activity.</desc>
  <style>
    .sans { font-family: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 2px; }
    .text { fill: #F4EDE1; }
    .muted { fill: #9A9086; }
    .accent { fill: #FF5A1F; }
    .flow { fill: none; stroke: #FF5A1F; stroke-width: 2.5; stroke-dasharray: 6 14; stroke-linecap: round; animation: flow 1.6s linear infinite; }
    .pulse { fill: none; stroke: #FF5A1F; stroke-width: 1.5; opacity: 0.35; transform-box: fill-box; transform-origin: center; animation: pulse 2.8s ease-out infinite; }
    .blink { animation: blink 2.4s steps(1) infinite; }
    @keyframes flow { to { stroke-dashoffset: -40; } }
    @keyframes pulse { 0% { transform: scale(1); opacity: 0.55; } 100% { transform: scale(1.9); opacity: 0; } }
    @keyframes blink { 50% { opacity: 0.2; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .pulse, .blink { animation: none; }
    }
  </style><defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#2A241F"/>
    </pattern>
  </defs>
  <rect width="1200" height="580" fill="#12100E"/>
