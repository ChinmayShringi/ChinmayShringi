<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-labelledby="title desc">
  <title id="title">End of notes</title>
  <desc id="desc">A routing line that ends at a glowing vermilion node, closing the profile.</desc>
  <style>
    .sans { font-family: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 2px; }
    .text { fill: #F4EDE1; }
    .muted { fill: #9A9086; }
    .accent { fill: #FF5A1F; }
    .flow { fill: none; stroke: #FF5A1F; stroke-width: 2.5; stroke-dasharray: 6 14; stroke-linecap: round; animation: flow 1.6s linear infinite; }
    .pulse { fill: none; stroke: #FF5A1F; stroke-width: 1.5; opacity: 0.35; transform-box: fill-box; transform-origin: center; animation: pulse 2.8s ease-out infinite; }
    .blink { animation: blink 2.4s steps(1) infinite; }
    @keyframes flow { to { stroke-dashoffset: -40; } }
    @keyframes pulse { 0% { transform: scale(1); opacity: 0.55; } 100% { transform: scale(1.9); opacity: 0; } }
    @keyframes blink { 50% { opacity: 0.2; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .pulse, .blink { animation: none; }
    }
  </style>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#2A241F"/>
    </pattern>
  </defs>
  <rect width="1200" height="200" fill="#12100E"/>
  <rect width="1200" height="200" fill="url(#dots)"/>
  <rect x="24" y="24" width="1152" height="152" fill="none" stroke="#3A332C" stroke-width="1"/><path d="M24 42V24H42" fill="none" stroke="#FF5A1F" stroke-width="3"/><path d="M1158 24H1176V42" fill="none" stroke="#FF5A1F" stroke-width="3"/><path d="M24 158V176H42" fill="none" stroke="#FF5A1F" stroke-width="3"/><path d="M1158 176H1176V158" fill="none" stroke="#FF5A1F" stroke-width="3"/>
  <g aria-hidden="true">
    <path d="M64 100H360V70H620V100H1000" fill="none" stroke="#3A332C" stroke-width="2.5"/>
    <path class="flow" d="M64 100H360V70H620V100H1000"/>
    <circle cx="64" cy="100" r="6" fill="#12100E" stroke="#F4EDE1" stroke-width="2"/>
    <circle cx="360" cy="100" r="4" fill="#3A332C"/>
    <circle cx="620" cy="70" r="4" fill="#3A332C"/>
    <circle class="pulse" cx="1030" cy="100" r="22"/>
    <circle cx="1030" cy="100" r="22" class="accent"/>
    <circle class="blink" cx="1030" cy="100" r="6" fill="#12100E"/>
  </g>
  <text x="64" y="150" class="mono muted" font-size="13">END OF NOTES // SIGNAL OPEN</text>
  <text x="1136" y="150" text-anchor="end" class="mono muted" font-size="13">CS7810 AT NYU.EDU</text>
</svg>
