<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1620" width="720" height="1620" role="img" aria-labelledby="title desc">
  <title id="title">Shoemaker Elves: plan, execute, review and plan the next batch</title>
  <desc id="desc">An illustrative LLM-mode workflow. An LLM plans a batch of atomic tasks, a coding agent executes them one at a time, and the LLM reviews results before planning the next batch. The return path represents the review loop, not measured activity.</desc>
  <style>
    .sans { font-family: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 2px; }
    .text { fill: #16120F; }
    .muted { fill: #675E54; }
    .accent { fill: #E0400C; }
    .flow { fill: none; stroke: #E0400C; stroke-width: 2.5; stroke-dasharray: 6 14; stroke-linecap: round; animation: flow 1.6s linear infinite; }
    .pulse { fill: none; stroke: #E0400C; stroke-width: 1.5; opacity: 0.35; transform-box: fill-box; transform-origin: center; animation: pulse 2.8s ease-out infinite; }
    .blink { animation: blink 2.4s steps(1) infinite; }
    @keyframes flow { to { stroke-dashoffset: -40; } }
    @keyframes pulse { 0% { transform: scale(1); opacity: 0.55; } 100% { transform: scale(1.9); opacity: 0; } }
    @keyframes blink { 50% { opacity: 0.2; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .pulse, .blink { animation: none; }
    }
  </style><defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#E3D8C6"/>
    </pattern>
  </defs>
  <rect width="720" height="1620" fill="#F6F0E5"/>
  <rect width="720" height="1620" fill="url(#dots)"/><rect x="24" y="24" width="672" height="1572" fill="none" stroke="#CFC3B1" stroke-width="1"/><path d="M24 42V24H42" fill="none" stroke="#E0400C" stroke-width="3"/><path d="M678 24H696V42" fill="none" stroke="#E0400C" stroke-width="3"/><path d="M24 1578V1596H42" fill="none" stroke="#E0400C" stroke-width="3"/><path d="M678 1596H696V1578" fill="none" stroke="#E0400C" stroke-width="3"/><text x="48" y="62" class="mono muted" font-size="20" text-anchor="start">REVIEWABLE AGENT WORK</text><text x="672" y="62" class="mono accent" font-size="20" text-anchor="end">003</text><path d="M48 82H672" fill="none" stroke="#CFC3B1" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><text x="44" y="175" class="sans text" font-size="91" font-weight="850" text-anchor="start">Shoemaker</text><text x="44" y="265" class="sans accent" font-size="91" font-weight="850" text-anchor="start">Elves</text><text x="48" y="340" class="mono accent" font-size="22" text-anchor="start">01</text><text x="108" y="341" class="sans text" font-size="32" font-weight="800" text-anchor="start">PLAN A BATCH</text><text x="108" y="383" class="sans text" font-size="25" font-weight="400" text-anchor="start">An LLM writes atomic tasks.</text><g transform="translate(108 412) scale(1.35)"><rect x="16" y="0" width="205" height="47" fill="#EFE7D9" stroke="#CFC3B1" stroke-width="1.5"/><text x="29" y="29" class="mono accent" font-size="12" text-anchor="start">01</text><text x="61" y="29" class="sans text" font-size="16" font-weight="550" text-anchor="start">atomic task</text><rect x="8" y="50" width="205" height="47" fill="#EFE7D9" stroke="#CFC3B1" stroke-width="1.5"/><text x="21" y="79" class="mono accent" font-size="12" text-anchor="start">02</text><text x="53" y="79" class="sans text" font-size="16" font-weight="550" text-anchor="start">atomic task</text><rect x="0" y="100" width="205" height="47" fill="#EFE7D9" stroke="#CFC3B1" stroke-width="1.5"/><text x="13" y="129" class="mono accent" font-size="12" text-anchor="start">N</text><text x="45" y="129" class="sans text" font-size="16" font-weight="550" text-anchor="start">atomic task</text><path d="M232 10V138M227 10H237M227 138H237" fill="none" stroke="#E0400C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/></g><text x="48" y="704" class="mono accent" font-size="22" text-anchor="start">02</text><text x="108" y="705" class="sans text" font-size="32" font-weight="800" text-anchor="start">EXECUTE IN SEQUENCE</text><text x="108" y="747" class="sans text" font-size="25" font-weight="400" text-anchor="start">A coding agent runs each task.</text><g transform="translate(108 778) scale(1.4)"><rect x="0" y="0" width="328" height="147" fill="#EFE7D9" stroke="#CFC3B1" stroke-width="1.5"/><text x="164" y="26" class="mono muted" font-size="12" text-anchor="middle">CODING AGENT</text><path d="M40 77H288" fill="none" stroke="#CFC3B1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><path class="flow" d="M40 77H288"/><circle cx="40" cy="77" r="22" fill="#F6F0E5" stroke="#E0400C" stroke-width="2"/><text x="40" y="84" class="sans accent" font-size="19" font-weight="700" text-anchor="middle">01</text><circle cx="164" cy="77" r="22" fill="#F6F0E5" stroke="#E0400C" stroke-width="2"/><text x="164" y="84" class="sans accent" font-size="19" font-weight="700" text-anchor="middle">02</text><circle cx="288" cy="77" r="22" fill="#F6F0E5" stroke="#E0400C" stroke-width="2"/><text x="288" y="84" class="sans accent" font-size="19" font-weight="700" text-anchor="middle">N</text><path d="M105 71L111 77L105 83" fill="none" stroke="#E0400C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><path d="M230 71L236 77L230 83" fill="none" stroke="#E0400C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><text x="164" y="128" class="mono muted" font-size="10" text-anchor="middle">ONE TASK AT A TIME</text></g><text x="48" y="1070" class="mono accent" font-size="22" text-anchor="start">03</text><text x="108" y="1071" class="sans text" font-size="32" font-weight="800" text-anchor="start">REVIEW RESULTS</text><text x="108" y="1113" class="sans text" font-size="25" font-weight="400" text-anchor="start">The LLM checks the work.</text><g transform="translate(108 1144) scale(1.35)"><rect x="0" y="0" width="220" height="147" fill="#EFE7D9" stroke="#CFC3B1" stroke-width="1.5"/><text x="110" y="27" class="mono accent" font-size="12" text-anchor="middle">LLM REVIEW</text><path d="M28 53H94M28 73H82M28 93H103M28 113H69" fill="none" stroke="#CFC3B1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><path d="M135 49L188 49L188 104L161 123L135 104Z" fill="none" stroke="#16120F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><path d="M146 79H176M146 91H168" fill="none" stroke="#E0400C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><path d="M123 43V129M119 43H127M119 129H127" fill="none" stroke="#E0400C" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/></g><text x="48" y="1470" class="mono accent" font-size="22" text-anchor="start">04</text><text x="108" y="1471" class="sans text" font-size="32" font-weight="800" text-anchor="start">PLAN THE NEXT BATCH</text><text x="108" y="1513" class="sans text" font-size="25" font-weight="400" text-anchor="start">Review feeds the next plan.</text><path d="M451 1244H630V430H464" fill="none" stroke="#CFC3B1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><path class="flow" d="M451 1244H630V430H464"/><path d="M474 420L464 430L474 440" fill="none" stroke="#E0400C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><path d="M80 615V661" fill="none" stroke="#CFC3B1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><path class="flow" d="M80 615V661"/><path d="M72 653L80 661L88 653" fill="none" stroke="#E0400C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><path d="M80 987V1031" fill="none" stroke="#CFC3B1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><path class="flow" d="M80 987V1031"/><path d="M72 1023L80 1031L88 1023" fill="none" stroke="#E0400C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><path d="M80 1366V1429" fill="none" stroke="#CFC3B1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><path class="flow" d="M80 1366V1429"/><path d="M72 1421L80 1429L88 1421" fill="none" stroke="#E0400C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><g transform="rotate(-90 650 900)"><text x="650" y="900" class="mono accent" font-size="20" text-anchor="middle">REVIEW LOOP</text></g><path d="M48 1552H672" fill="none" stroke="#CFC3B1" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><text x="48" y="1584" class="mono muted" font-size="20" text-anchor="start">LLM MODE / ILLUSTRATIVE WORKFLOW</text><text x="672" y="1584" class="mono accent" font-size="20" text-anchor="end">+</text>
</svg>
