<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="title desc">
  <title id="title">Systems Atlas: trace the ideas and inspect the systems</title>
  <desc id="desc">An engineering field guide connecting Systems, Intelligence and Security to nine public projects and publications by Chinmay Shringi. Entries include GRAFT, SLM Swarm, Shoemaker Elves, SourceSnap, Persona AI, Hybrid RAG, AI-Driven Database, Branch-Commit-Validate and Spotlight Benchmark. Connections are conceptual, not runtime data. Open the linked interactive Atlas to explore the work.</desc>
  <style>
    .sans { font-family: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 2px; }
    .text { fill: #16120F; }
    .muted { fill: #675E54; }
    .accent { fill: #E0400C; }
    .flow { fill: none; stroke: #E0400C; stroke-width: 2.5; stroke-dasharray: 6 14; stroke-linecap: round; animation: flow 1.6s linear infinite; }
    .pulse { fill: none; stroke: #E0400C; stroke-width: 1.5; opacity: 0.35; transform-box: fill-box; transform-origin: center; animation: pulse 2.8s ease-out infinite; }
    .blink { animation: blink 2.4s steps(1) infinite; }
    @keyframes flow { to { stroke-dashoffset: -40; } }
    @keyframes pulse { 0% { transform: scale(1); opacity: 0.55; } 100% { transform: scale(1.9); opacity: 0; } }
    @keyframes blink { 50% { opacity: 0.2; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .pulse, .blink { animation: none; }
    }
  </style><defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#E3D8C6"/>
    </pattern>
  </defs>
