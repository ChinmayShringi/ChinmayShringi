<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-labelledby="title desc">
  <title id="title">End of notes</title>
  <desc id="desc">Closing sheet listing the profile's design tokens (ink, paper, vermilion, ember, stone) beside a routing line that ends at a glowing vermilion node.</desc>
  <style>
    .sans { font-family: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 2px; }
    .text { fill: #16120F; }
    .muted { fill: #675E54; }
    .accent { fill: #E0400C; }
    .flow { fill: none; stroke: #E0400C; stroke-width: 2.5; stroke-dasharray: 6 14; stroke-linecap: round; animation: flow 1.6s linear infinite; }
    .pulse { fill: none; stroke: #E0400C; stroke-width: 1.5; opacity: 0.35; transform-box: fill-box; transform-origin: center; animation: pulse 2.8s ease-out infinite; }
    .blink { animation: blink 2.4s steps(1) infinite; }
    @keyframes flow { to { stroke-dashoffset: -40; } }
    @keyframes pulse { 0% { transform: scale(1); opacity: 0.55; } 100% { transform: scale(1.9); opacity: 0; } }
    @keyframes blink { 50% { opacity: 0.2; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .pulse, .blink { animation: none; }
    }
  </style>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#E3D8C6"/>
    </pattern>
  </defs>
  <rect width="1200" height="220" fill="#F6F0E5"/>
  <rect width="1200" height="220" fill="url(#dots)"/>
  <rect x="24" y="24" width="1152" height="172" fill="none" stroke="#CFC3B1" stroke-width="1"/><path d="M24 42V24H42" fill="none" stroke="#E0400C" stroke-width="3"/><path d="M1158 24H1176V42" fill="none" stroke="#E0400C" stroke-width="3"/><path d="M24 178V196H42" fill="none" stroke="#E0400C" stroke-width="3"/><path d="M1158 196H1176V178" fill="none" stroke="#E0400C" stroke-width="3"/>
  <text x="64" y="50" class="mono muted" font-size="11">DESIGN TOKENS</text>
  <rect x="64" y="64" width="64" height="64" rx="12" fill="#16120F" stroke="#CFC3B1" stroke-width="1.5"/><text x="64" y="150" class="mono text" font-size="11">INK</text><text x="64" y="168" class="mono muted" font-size="11">#16120F</text><rect x="192" y="64" width="64" height="64" rx="12" fill="#F6F0E5" stroke="#CFC3B1" stroke-width="1.5"/><text x="192" y="150" class="mono text" font-size="11">PAPER</text><text x="192" y="168" class="mono muted" font-size="11">#F6F0E5</text><rect x="320" y="64" width="64" height="64" rx="12" fill="#E0400C" stroke="#CFC3B1" stroke-width="1.5"/><text x="320" y="150" class="mono text" font-size="11">VERMILION</text><text x="320" y="168" class="mono muted" font-size="11">#E0400C</text><rect x="448" y="64" width="64" height="64" rx="12" fill="#C9621A" stroke="#CFC3B1" stroke-width="1.5"/><text x="448" y="150" class="mono text" font-size="11">EMBER</text><text x="448" y="168" class="mono muted" font-size="11">#C9621A</text><rect x="576" y="64" width="64" height="64" rx="12" fill="#675E54" stroke="#CFC3B1" stroke-width="1.5"/><text x="576" y="150" class="mono text" font-size="11">STONE</text><text x="576" y="168" class="mono muted" font-size="11">#675E54</text>
  <g aria-hidden="true">
    <path d="M720 96H820V72H940V96H1020" fill="none" stroke="#CFC3B1" stroke-width="2.5"/>
    <path class="flow" d="M720 96H820V72H940V96H1020"/>
    <circle cx="720" cy="96" r="6" fill="#F6F0E5" stroke="#16120F" stroke-width="2"/>
    <circle class="pulse" cx="1050" cy="96" r="22"/>
    <circle cx="1050" cy="96" r="22" class="accent"/>
    <circle class="blink" cx="1050" cy="96" r="6" fill="#F6F0E5"/>
  </g>
  <text x="1136" y="150" text-anchor="end" class="mono text" font-size="12">END OF NOTES // SIGNAL OPEN</text>
  <text x="1136" y="168" text-anchor="end" class="mono muted" font-size="12">CS7810 AT NYU.EDU</text>
</svg>
