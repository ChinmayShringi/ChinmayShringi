ht="188" fill="#EFE7D9" stroke="#CFC3B1"/><rect x="800" y="36" width="352" height="4" fill="#E0400C"/><text x="824" y="80" class="mono accent" font-size="14" font-weight="700">03</text><rect x="1072" y="58" width="56" height="40" fill="none" stroke="#16120F" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="1084" y="67" width="32" height="22" fill="none" stroke="#16120F" stroke-width="1.5"/><rect x="1094" y="73" width="12" height="10" fill="#E0400C"/><text x="824" y="148" class="sans text" font-size="34" font-weight="800">SECURITY</text><text x="824" y="180" class="mono muted" font-size="13">RED-TEAM WORKFLOWS</text><text x="824" y="202" class="mono muted" font-size="13">DEFENSIVE AI BENCHMARKS</text>
